---
layout: default
---

<!-- Load network visualization modules in dependency order -->
<script src="{{ '/assets/js/network-utils.js' | relative_url }}"></script>
<script src="{{ '/assets/js/network-physics.js' | relative_url }}"></script>
<script src="{{ '/assets/js/network-renderer.js' | relative_url }}"></script>
<script src="{{ '/assets/js/network-sound.js' | relative_url }}"></script>
<script src="{{ '/assets/js/network-interaction.js' | relative_url }}"></script>
<script src="{{ '/assets/js/network-viz-core.js' | relative_url }}"></script>

<header style="text-align: center; margin-top: 20px; margin-bottom: 0px;">
  <div style="display: flex; justify-content: center; align-items: center; margin-bottom: 0px;">
    <canvas id="headerViz" width="1200" height="240" style="display: block;"></canvas>
  </div>
</header>

<script>
  // Initialize the header visualization
  const headerCanvas = document.getElementById('headerViz');
  const headerViz = new NetworkViz({
    canvas: headerCanvas,
    nodes: ['string', 'theory'],
    edges: [{ from: 'string', to: 'theory', direction: 'forward' }],
    mode: 'display',
    randomSeed: 42,
    givenWords: ['string', 'theory'],
    bounds: { x: 25, y: 5, width: 450, height: 90 },  // Smaller bounds with margins
    scaleFactor: 1.2,  // With 2x multiplier becomes 2.4
    // Don't set fontSize - let it calculate from viewScale for proper proportions
    showBounds: true,
    displayConfig: {
      enablePhysics: true,
      enableDancing: false,
      showLabelsAlways: true,
      boxStyle: 'fitted',
      useBoundaryRepulsion: true
    },
    physicsConfig: {
      physicsStepsPerFrame: 10,
      lengthScale: 60,
      repulsionFactor: 0.05,
      attractionFactor: 0.3
    }
  });

  // Position nodes manually in virtual coordinates
  // Virtual canvas is 500x100, center them in the bounds
  headerViz.nodePositions['string'].x = 175;
  headerViz.nodePositions['string'].y = 50;
  headerViz.nodePositions['theory'].x = 325;
  headerViz.nodePositions['theory'].y = 50;

  // Override getNodeColor to always return white
  headerViz.getNodeColor = function() {
    return '#ffffff';
  };

  headerViz.start();
</script>

<main style="text-align: center; margin-top: 0px; padding-top: 0px;">
  <div style="display: flex; justify-content: center; align-items: center;">
    <canvas id="levelSelectViz" width="1200" height="320" style="display: block;"></canvas>
  </div>
</main>

<footer style="text-align: center; margin-top: 40px; margin-bottom: 40px;">
  <button id="eraseAllProgressButton" style="padding: 8px 16px; font-family: 'Gill Sans', sans-serif; font-size: 14px; background-color: white; color: #999; border: 2px solid #999; border-radius: 4px; cursor: pointer;">erase all progress</button>
</footer>

<script>
  // Initialize the level selection visualization
  const levelSelectCanvas = document.getElementById('levelSelectViz');

  // Get completed levels from localStorage
  let completedLevels = [];
  try {
    completedLevels = JSON.parse(localStorage.getItem('completed_levels') || '[]');
  } catch (e) {
    console.error('Error loading completed levels:', e);
  }

  // Create nodes and edges only for unlocked levels
  const allLevelNames = ['one', 'two', 'three', 'four', 'five', 'six', 'seven'];

  // Determine highest unlocked level (completed levels + 1)
  const maxCompletedLevel = completedLevels.length > 0 ? Math.max(...completedLevels) : 0;
  const highestUnlockedLevel = Math.min(maxCompletedLevel + 1, 7);

  console.log('📊 Completed levels:', completedLevels);
  console.log('📊 Max completed level:', maxCompletedLevel);
  console.log('📊 Highest unlocked level:', highestUnlockedLevel);
  console.log('📊 Will show nodes:', allLevelNames.slice(0, highestUnlockedLevel));

  const levelNodes = allLevelNames.slice(0, highestUnlockedLevel);

  const levelEdges = [];
  for (let i = 0; i < levelNodes.length - 1; i++) {
    levelEdges.push({ from: levelNodes[i], to: levelNodes[i + 1], direction: 'forward' });
  }

  // Map node names to level numbers
  const nodeToLevel = {
    'one': 1, 'two': 2, 'three': 3, 'four': 4,
    'five': 5, 'six': 6, 'seven': 7
  };

  // Calculations for bounds to align with header:
  // Header: bounds { x: 25, width: 450 } with viewScale 2.4 = 1080 pixels wide on screen
  // To match: need 1080 pixels / 1.5 viewScale = 720 virtual units wide
  // Header x: 25 virtual × 2.4 = 60 pixels from left
  // To match: 60 pixels / 1.5 = 40 virtual units from left
  // Canvas: 1200x320 physical, viewScale 1.5 means 800x213 virtual
  const levelSelectViz = new NetworkViz({
    canvas: levelSelectCanvas,
    nodes: levelNodes,
    edges: levelEdges,
    mode: 'display',
    randomSeed: 123,
    givenWords: levelNodes,
    bounds: { x: 40, y: 10, width: 720, height: 190 },
    scaleFactor: 0.75,  // With 2x multiplier = 1.5 viewScale
    showBounds: true,   // Show red bounding box
    displayConfig: {
      enablePhysics: false,  // Disable physics - nodes will stay where positioned
      enableDancing: false,
      showLabelsAlways: true,
      boxStyle: 'fitted',  // Fit to word width
      useBoundaryRepulsion: false  // Use center-to-center repulsion (not edge-aware)
    },
    physicsConfig: {
      physicsStepsPerFrame: 10,
      lengthScale: 70,
      repulsionFactor: 0.05,
      attractionFactor: 0.4
    }
  });

  // Override getNodeColor to use pastel ROYGBIV colors
  const roygbivColors = [
    'rgb(255, 204, 204)',  // Pastel Red
    'rgb(255, 229, 204)',  // Pastel Orange
    'rgb(255, 255, 204)',  // Pastel Yellow
    'rgb(204, 255, 204)',  // Pastel Green
    'rgb(204, 229, 255)',  // Pastel Blue
    'rgb(229, 204, 255)',  // Pastel Indigo
    'rgb(255, 204, 255)'   // Pastel Violet
  ];

  // Animation state for newly completed level
  let animatingLevel = null;
  let animationProgress = 0;
  const ANIMATION_DURATION = 2000; // 2 seconds
  let animationStartTime = null;

  // Check if there's a newly completed level that needs animation
  const lastCompletedLevel = sessionStorage.getItem('last_completed_level');
  if (lastCompletedLevel) {
    const levelNum = parseInt(lastCompletedLevel);
    if (completedLevels.includes(levelNum)) {
      animatingLevel = levelNum;
      sessionStorage.removeItem('last_completed_level'); // Clear flag
    }
  }

  levelSelectViz.getNodeColor = function(node) {
    const index = levelNodes.indexOf(node);
    const levelNum = index + 1;  // one=1, two=2, etc.

    // If this is the animating level, interpolate between white and color
    if (animatingLevel === levelNum && animationProgress < 1) {
      const targetColor = roygbivColors[index];
      // Parse RGB from target color (format: "rgb(r, g, b)")
      const match = targetColor.match(/rgb\((\d+),\s*(\d+),\s*(\d+)\)/);
      if (match) {
        const r = Math.round(255 + (parseInt(match[1]) - 255) * animationProgress);
        const g = Math.round(255 + (parseInt(match[2]) - 255) * animationProgress);
        const b = Math.round(255 + (parseInt(match[3]) - 255) * animationProgress);
        return `rgb(${r}, ${g}, ${b})`;
      }
    }

    // If level is completed, show its color, otherwise white
    if (completedLevels.includes(levelNum)) {
      return roygbivColors[index];
    } else {
      return '#ffffff';  // White for incomplete
    }
  };

  // Initialize nodes in vertical line (one at top, seven at bottom)
  const centerX = 40 + 720 / 2;  // Center of bounds horizontally (matches header in pixels)
  const topY = 10 + 20;  // Start near top of bounds
  const bottomY = 10 + 190 - 20;  // End near bottom of bounds
  const spacing = levelNodes.length > 1 ? (bottomY - topY) / (levelNodes.length - 1) : 0;  // Space evenly

  levelNodes.forEach((node, index) => {
    levelSelectViz.nodePositions[node].x = centerX;
    levelSelectViz.nodePositions[node].y = topY + index * spacing;
  });

  levelSelectViz.start();

  // Animation loop for level completion
  function animateCompletion() {
    if (animatingLevel !== null) {
      const now = Date.now();
      if (animationStartTime === null) {
        animationStartTime = now;
      }

      const elapsed = now - animationStartTime;
      animationProgress = Math.min(elapsed / ANIMATION_DURATION, 1);

      if (animationProgress >= 1) {
        animatingLevel = null;  // Animation complete
        animationStartTime = null;
      }
    }
    requestAnimationFrame(animateCompletion);
  }
  animateCompletion();

  // Add double-click handler for level selection
  levelSelectCanvas.addEventListener('dblclick', (e) => {
    const rect = levelSelectCanvas.getBoundingClientRect();
    const screenX = (e.clientX - rect.left) * (levelSelectCanvas.width / rect.width);
    const screenY = (e.clientY - rect.top) * (levelSelectCanvas.height / rect.height);

    // Convert to virtual coordinates
    const virtualPos = levelSelectViz.toVirtualCoords({ x: screenX, y: screenY });

    // Check which node was double-clicked
    for (const node of levelNodes) {
      const pos = levelSelectViz.nodePositions[node];
      const box = levelSelectViz.getBoxDimensions(node);

      if (Math.abs(virtualPos.x - pos.x) <= box.width / 2 &&
          Math.abs(virtualPos.y - pos.y) <= box.height / 2) {
        // Navigate to the level using the mapping
        const levelNum = nodeToLevel[node];
        window.location.href = `{{ site.baseurl }}/level${levelNum}/`;
        break;
      }
    }
  });

  // Add hover effect - change cursor
  levelSelectCanvas.addEventListener('mousemove', (e) => {
    const rect = levelSelectCanvas.getBoundingClientRect();
    const screenX = (e.clientX - rect.left) * (levelSelectCanvas.width / rect.width);
    const screenY = (e.clientY - rect.top) * (levelSelectCanvas.height / rect.height);

    const virtualPos = levelSelectViz.toVirtualCoords({ x: screenX, y: screenY });

    let hovering = false;
    for (const node of levelNodes) {
      const pos = levelSelectViz.nodePositions[node];
      const box = levelSelectViz.getBoxDimensions(node);

      if (Math.abs(virtualPos.x - pos.x) <= box.width / 2 &&
          Math.abs(virtualPos.y - pos.y) <= box.height / 2) {
        hovering = true;
        break;
      }
    }

    levelSelectCanvas.style.cursor = hovering ? 'pointer' : 'default';
  });

  // Erase all progress button handler
  document.getElementById('eraseAllProgressButton').addEventListener('click', () => {
    if (confirm('erase ALL progress? this will reset level completions AND puzzle progress for all levels.')) {
      try {
        // Clear level completions
        localStorage.removeItem('completed_levels');
        sessionStorage.removeItem('last_completed_level');

        // Clear all puzzle progress using actual page titles
        const puzzleTitles = [
          'Humble beginnings',
          'Learning to walk',
          'Learning to run',
          'Scramble',
          'Recurrence',
          'Invisible connections',
          'Untitled'
        ];

        puzzleTitles.forEach(title => {
          localStorage.removeItem(`network_puzzle_${title}_guessed`);
        });

        console.log('✅ All progress erased');
        location.reload();
      } catch (e) {
        console.error('Error erasing progress:', e);
        alert('failed to erase progress. check console for details.');
      }
    }
  });
</script>
