---
layout: default
---

<!-- Load network visualization modules in dependency order -->
<script src="{{ '/assets/js/network-utils.js' | relative_url }}"></script>
<script src="{{ '/assets/js/network-physics.js' | relative_url }}"></script>
<script src="{{ '/assets/js/network-renderer.js' | relative_url }}"></script>
<script src="{{ '/assets/js/network-sound.js' | relative_url }}"></script>
<script src="{{ '/assets/js/network-interaction.js' | relative_url }}"></script>
<script src="{{ '/assets/js/network-viz-core.js' | relative_url }}"></script>
<script src="{{ '/assets/js/puzzle-parser.js' | relative_url }}"></script>

<div class="container">
  <h1 style="margin-top: 1em;" id="puzzleTitle">{{ page.title }}</h1>

  <div style="position: relative; width: 100%; max-width: 1200px;">
    <button id="resetButton" style="position: absolute; top: -45px; right: 0; padding: 6px 14px; font-family: 'Gill Sans', sans-serif; font-size: 16px; background-color: white; color: black; border: 2px solid #ccc; border-radius: 4px; cursor: pointer;">reset</button>
    <canvas id="graphCanvas" width="1200" height="800" style="border: 1px solid #ccc; display: block; width: 100%;"></canvas>

    {% comment %}
    Temporarily disabled post-text overlay
    {% if page.post_text %}
    <div id="postTextOverlay" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; align-items: center; justify-content: center; pointer-events: none; opacity: 0; z-index: 1000; background-color: rgba(255, 255, 255, 0.95);">
      <div style="padding: 30px 40px; max-width: 80%; text-align: center; font-family: 'Gill Sans', sans-serif; font-size: 24px; color: #2a9d8f; line-height: 1.5;">
        {{ page.post_text }}
      </div>
    </div>
    {% endif %}
    {% endcomment %}
  </div>

  <div style="margin-top: 20px;">
    <input type="text" id="guessInput" placeholder="Type a guess and press Enter" style="width: 400px; padding: 10px; font-size: 16px; font-family: 'Gill Sans', sans-serif;">
    <div id="feedback" style="margin-top: 10px; font-size: 16px; font-family: 'Gill Sans', sans-serif;"></div>
  </div>
</div>

<script>
  // Parse puzzle data
  const puzzleData = parsePuzzleData(`{% include_relative {{ page.data_file }} %}`);

  // Update title if overridden in data file
  if (puzzleData.puzzleName) {
    document.getElementById('puzzleTitle').textContent = puzzleData.puzzleName;
  }

  // Load saved progress
  const STORAGE_KEY = 'network_puzzle_{{ page.title }}_guessed';
  let savedWords = [];
  try {
    const savedProgress = localStorage.getItem(STORAGE_KEY);
    if (savedProgress) {
      const loadedWords = JSON.parse(savedProgress);
      // Filter out words that aren't in the current puzzle (cleanup old/invalid data)
      savedWords = loadedWords.filter(word => puzzleData.nodes.includes(word));

      // If we filtered out invalid words, update storage
      if (savedWords.length !== loadedWords.length) {
        console.log('Cleaned up invalid saved words:', loadedWords, '-> valid:', savedWords);
        if (savedWords.length > 0) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(savedWords));
        } else {
          localStorage.removeItem(STORAGE_KEY);
        }
      } else {
        console.log('Loaded saved words:', savedWords, 'from key:', STORAGE_KEY);
      }
    }
  } catch (e) {
    console.error('Error loading saved progress:', e);
  }

  // Load precomputed positions
  async function loadPrecomputedPositions() {
    try {
      const response = await fetch('{{ "/assets/data/puzzle_layouts.json" | relative_url }}');
      if (!response.ok) {
        console.warn('⚠️  Precomputed layouts file not found (status ' + response.status + ')');
        return null;
      }
      const layouts = await response.json();
      const layout = layouts[puzzleData.puzzleName];
      if (!layout) {
        console.warn('⚠️  No precomputed layout found for puzzle:', puzzleData.puzzleName);
        return null;
      }
      return layout.positions;
    } catch (e) {
      console.warn('⚠️  Error loading precomputed positions:', e);
      return null;
    }
  }

  // Initialize puzzle with precomputed positions
  loadPrecomputedPositions().then(precomputedPositions => {
    const canvas = document.getElementById('graphCanvas');
    const viz = new NetworkViz({
      canvas: canvas,
      nodes: puzzleData.nodes,
      edges: puzzleData.edges,
      mode: 'game',
      randomSeed: puzzleData.randomSeed,
      givenWords: puzzleData.givenWords,
      savedWords: savedWords,  // Pass saved words separately so they get colored
      gimmick: puzzleData.gimmick,
      puzzleName: puzzleData.puzzleName,
      level: {{ page.level | jsonify }},
      storageKey: STORAGE_KEY,
      victoryText: {{ page.victory_text | jsonify }},
      precomputedPositions: precomputedPositions
    });

    window.viz = viz;  // Make available globally for debugging

    // Override victory music function
    viz.playVictoryMusic = function() {
    const victoryAudio = new Audio('{{site.baseurl}}/audio/{{ page.victory_audio }}');
    victoryAudio.volume = 0.5;
    victoryAudio.play().catch(err => console.log('Victory audio play failed:', err));
  };

  // Function to show post-text overlay with animation (temporarily disabled)
  function showPostTextOverlay() {
    // Temporarily disabled
    /*
    {% if page.post_text %}
    const postTextOverlay = document.getElementById('postTextOverlay');
    if (!postTextOverlay) return;

    const FADE_IN_MS = 2000;
    const STAY_MS = 5000;
    const FADE_OUT_MS = 2000;

    postTextOverlay.style.display = 'flex';

    // Fade in
    setTimeout(() => {
      postTextOverlay.style.transition = `opacity ${FADE_IN_MS}ms ease-in-out`;
      postTextOverlay.style.opacity = '1';
    }, 100);

    // Fade out
    setTimeout(() => {
      postTextOverlay.style.transition = `opacity ${FADE_OUT_MS}ms ease-in-out`;
      postTextOverlay.style.opacity = '0';
    }, 100 + FADE_IN_MS + STAY_MS);

    // Hide after animation completes
    setTimeout(() => {
      postTextOverlay.style.display = 'none';
    }, 100 + FADE_IN_MS + STAY_MS + FADE_OUT_MS);
    {% endif %}
    */
  }

    // Handle first interaction for audio context
    const wasAlreadyComplete = viz.guessedWords.size === viz.nodes.length;
    const handleFirstInteraction = () => {
      if (NetworkViz.audioContext && NetworkViz.audioContext.state === 'suspended') {
        NetworkViz.audioContext.resume();
      }

      if (wasAlreadyComplete) {
        viz.playVictoryMusic();
        showPostTextOverlay();
      }
    };

    document.addEventListener('click', handleFirstInteraction, { once: true });

    // Setup guess input
    const guessInput = document.getElementById('guessInput');
    const feedbackEl = document.getElementById('feedback');

    guessInput.addEventListener('focus', handleFirstInteraction, { once: true });

    guessInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      const guess = guessInput.value;
      guessInput.value = '';

      const result = viz.handleGuess(guess);
      if (!result) return;

      const message = document.createElement('div');
      message.style.marginBottom = '5px';

      if (result.found) {
        message.textContent = `✓ ${guess}`;
        message.style.color = '#2a9d8f';
      } else if (result.alreadyRevealed) {
        message.textContent = `${guess} (already revealed)`;
        message.style.color = '#888';
      } else {
        message.textContent = `✗ ${guess}`;
        message.style.color = '#e63946';
      }

      feedbackEl.prepend(message);

      // Show post text overlay when puzzle complete
      if (viz.guessedWords.size === viz.nodes.length) {
        showPostTextOverlay();
      }
    }
    });

    // Setup reset button
    const resetButton = document.getElementById('resetButton');
    resetButton.addEventListener('click', () => {
      if (confirm('delete puzzle progress?')) {
        viz.resetProgress();
        location.reload();
      }
    });

    // Start visualization
    viz.start();
  });  // End of loadPrecomputedPositions().then()

  // Handle pre-text overlay animation
  {% if page.pre_text %}
  const preTextOverlay = document.getElementById('preTextOverlay');
  console.log('Pre-text overlay:', preTextOverlay, 'Saved words:', savedWords.length);

  if (preTextOverlay && savedWords.length === 0) {
    // Only show if no progress has been made
    const FADE_IN_MS = 2000;
    const STAY_MS = 5000;
    const FADE_OUT_MS = 2000;

    console.log('Starting pre-text animation');

    // Fade in
    setTimeout(() => {
      preTextOverlay.style.transition = `opacity ${FADE_IN_MS}ms ease-in-out`;
      preTextOverlay.style.opacity = '1';
      console.log('Fading in pre-text');
    }, 100);

    // Fade out
    setTimeout(() => {
      preTextOverlay.style.transition = `opacity ${FADE_OUT_MS}ms ease-in-out`;
      preTextOverlay.style.opacity = '0';
      console.log('Fading out pre-text');
    }, 100 + FADE_IN_MS + STAY_MS);

    // Remove from DOM after animation completes
    setTimeout(() => {
      preTextOverlay.remove();
      console.log('Removed pre-text overlay');
    }, 100 + FADE_IN_MS + STAY_MS + FADE_OUT_MS);
  } else if (preTextOverlay) {
    // Remove immediately if there's already progress
    console.log('Removing pre-text immediately (has progress)');
    preTextOverlay.remove();
  }
  {% endif %}
</script>
